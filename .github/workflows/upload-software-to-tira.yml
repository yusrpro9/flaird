name: Upload Software to TIRA

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Directory containing the submission"
        required: true
        default: "."
        type: string
      model_id:
        description: "Hugging Face model repository ID"
        required: true
        default: "yusr9/flaird-modernbert-large-attention-multitask-frozen"
        type: string
      dry_run:
        description: "Build and test without uploading to TIRA"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  DOCKER_HOST: unix:///var/run/docker.sock
  TIRA_CLI_VERSION: "0.0.204"
  TIRA_TASK: generative-ai-authorship-verification-panclef-2026
  TIRA_DATASET: pan26-generative-ai-detection-smoke-test-20260330-training

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TIRA CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tira==${TIRA_CLI_VERSION}"

      - name: Authenticate with TIRA
        run: tira-cli login --token "${{ secrets.TIRA_CLIENT_TOKEN }}"

      - name: Verify local installation
        run: tira-cli verify-installation --local-only

      - name: Download and materialize Hugging Face model
        env:
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          [[ "${MODEL_ID}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || {
            echo "::error::model_id must have the form owner/repository"
            exit 1
          }

          python -m pip install --upgrade "huggingface_hub>=0.34,<2"
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          from huggingface_hub import snapshot_download

          repo_id = os.environ["MODEL_ID"]
          snapshot = Path(snapshot_download(repo_id=repo_id, ignore_patterns=["onnx/*"]))
          materialized = snapshot.with_name(f"{snapshot.name}.materialized")

          if materialized.exists():
              shutil.rmtree(materialized)
          shutil.copytree(snapshot, materialized, symlinks=False)
          shutil.rmtree(snapshot)
          materialized.rename(snapshot)

          weights = [*snapshot.glob("*.safetensors"), *snapshot.glob("*.bin")]
          if not any(weight.is_file() and weight.stat().st_size > 0 for weight in weights):
              raise RuntimeError(f"No non-empty model weights found in {snapshot}")

          print(f"Prepared model {repo_id} at {snapshot}")
          for weight in weights:
              print(f"Weight: {weight.name} ({weight.stat().st_size} bytes)")
          PY

          cache="${HOME}/.cache/huggingface/hub/models--${MODEL_ID//\//--}"
          test -d "${cache}"
          test -n "$(find "${cache}/snapshots" -type f \( -name '*.safetensors' -o -name '*.bin' \) -size +0c -print -quit)"

      - name: Build, test, and optionally upload image
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          [[ "${MODEL_ID}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]

          submission_args=(
            --path "${{ inputs.directory }}"
            --task "${TIRA_TASK}"
            --dataset "${TIRA_DATASET}"
            --platform linux/amd64
            --mount-hf-model "${MODEL_ID}"
            --command "/usr/local/bin/flaird-tira-test --model ${MODEL_ID}"
          )

          if [[ "${DRY_RUN}" == "true" ]]; then
            submission_args+=(--dry-run)
          fi

          tira-cli code-submission "${submission_args[@]}"
