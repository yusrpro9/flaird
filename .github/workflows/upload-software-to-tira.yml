name: Upload Software to TIRA

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Directory containing the submission; use . for the repository root"
        required: true
        default: .
        type: string
      model_id:
        description: "Hugging Face model repository (full ID or repository name)"
        required: true
        default: yusr9/flaird-modernbert-large-gated-multitask
        type: string
      dry_run:
        description: "Build and test without uploading to TIRA"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOCKER_HOST: unix:///var/run/docker.sock
  TIRA_CLI_VERSION: "0.0.204"
  TIRA_TASK: generative-ai-authorship-verification-panclef-2026
  TIRA_DATASET: pan26-generative-ai-detection-smoke-test-20260330-training
  HF_USERNAME: ${{ secrets.HF_USERNAME }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TIRA_CLIENT_TOKEN: ${{ secrets.TIRA_CLIENT_TOKEN }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate secrets and normalize model ID
        env:
          MODEL_INPUT: ${{ inputs.model_id }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in HF_USERNAME HF_TOKEN TIRA_CLIENT_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required secret ${variable} is not configured."
              exit 1
            fi
          done

          if [[ "${MODEL_INPUT}" == */* ]]; then
            model_id="${MODEL_INPUT}"
          else
            model_id="${HF_USERNAME}/${MODEL_INPUT}"
          fi
          if [[ ! "${model_id}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::model_id must be a valid owner/repository identifier."
            exit 1
          fi
          echo "MODEL_ID=${model_id}" >> "${GITHUB_ENV}"

      - name: Install submission clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "huggingface_hub>=1.5,<2" \
            "tira==${TIRA_CLI_VERSION}"

      - name: Authenticate with TIRA
        run: tira-cli login --token "${TIRA_CLIENT_TOKEN}"

      - name: Verify local installation
        run: tira-cli verify-installation --local-only

      - name: Download Hugging Face model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          from huggingface_hub import snapshot_download

          path = snapshot_download(
              repo_id=os.environ["MODEL_ID"],
              token=os.environ["HF_TOKEN"],
              ignore_patterns=["onnx/*"],
          )
          from pathlib import Path

          model_path = Path(path)
          weight_files = [
              *model_path.glob("*.safetensors"),
              *model_path.glob("*.bin"),
          ]
          if not weight_files:
              raise RuntimeError(
                  f"No model weight file found in {model_path}; expected *.safetensors or *.bin."
              )
          print(f"Model cached at: {model_path}")
          print("Model weights:", ", ".join(file.name for file in weight_files))
          PY

      - name: Build, test, and upload image
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SUBMISSION_DIRECTORY: ${{ inputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          submission_args=(
            --path "${SUBMISSION_DIRECTORY}"
            --task "${TIRA_TASK}"
            --dataset "${TIRA_DATASET}"
            --platform linux/amd64
            --mount-hf-model "${MODEL_ID}"
            --command "/usr/local/bin/flaird --model ${MODEL_ID}"
          )

          if [[ "${DRY_RUN}" == "true" ]]; then
            submission_args+=(--dry-run)
          fi

          tira-cli code-submission "${submission_args[@]}"
